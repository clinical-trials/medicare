    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(212.92416 124.946894)">Work relative value units</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(212.92416 139.080331)">Full-episode resources</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(212.92416 154.095331)">Payment rules and amounts</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(212.92416 200.681888)">Match purpose and resources;</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(212.92416 212.956262)">retain differences in both directions.</text>
   </g>
   <g id="text_9">
