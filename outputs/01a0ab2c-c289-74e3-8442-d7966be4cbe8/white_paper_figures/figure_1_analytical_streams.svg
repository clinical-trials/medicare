   <g id="text_2">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243b49" x="23.82336" y="59.3208" transform="rotate(-0 23.82336 59.3208)">Clinical need and access</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(23.82336 94.035331)">Unit: patient / care episode</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(23.82336 106.5393)"/>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(23.82336 124.065331)">Coverage and restrictions</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(23.82336 139.080331)">Patient costs and delays</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(23.82336 154.095331)">Appropriate completed care</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(23.82336 200.681888)">Compare eligible women and men,</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #243b49" transform="translate(23.82336 212.161888)">or evaluate need within one group.</text>
   </g>
   <g id="text_5">
